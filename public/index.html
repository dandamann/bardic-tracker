<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bardic Inspiration</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Bardic Inspiration</h1>
      <span id="status" role="status">Connecting…</span>
    </header>
    <p id="error" role="alert" hidden></p>
    <p class="muted">Tap a character to add or remove inspiration.</p>
    <ul id="party"></ul>
    <p id="empty" class="muted" hidden>No characters yet. Add your party below.</p>
    <form id="form" hidden>
      <input name="name" maxlength="40" required autocomplete="off" placeholder="Character name" aria-label="Character name">
      <input name="imageUrl" type="url" maxlength="1000" autocomplete="off" placeholder="Image URL (optional)" aria-label="Image URL (optional)">
      <button class="primary">Add</button>
    </form>
    <div class="transfer">
      <button type="button" id="embedBtn">🔗 Copy OBS embed link</button>
      <button type="button" id="exportBtn" disabled>Export JSON</button>
      <button type="button" id="importBtn" disabled hidden>Import JSON</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button type="button" id="manageBtn" hidden>🔒 Manage</button>
    </div>
  </main>
  <nav class="app-switcher" aria-label="Party apps" hidden>
    <a id="soundboardLink">🔊 Soundboard</a>
    <a href="/" aria-current="page">♪ Inspiration</a>
  </nav>
  <script src="/app.js"></script>
</body>
</html>
